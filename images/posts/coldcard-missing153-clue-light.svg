<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="580" viewBox="0 0 1500 580" role="img" aria-labelledby="title desc"><title id="title">Six search families, the same unresolved 153</title><desc id="desc">Wider paths, device histories, dice, pad ranges, related wallets, and passphrases all fail to derive one of the 153 unresolved Wave 1 sources.</desc><rect width="1500" height="580" fill="#f8fafc"/><style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.h{font-size:38px;font-weight:700;fill:#0f172a}.s{font-size:18px;fill:#475569}.t{font-size:22px;font-weight:700;fill:#0f172a}.c{font-size:20px;font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,monospace;fill:#0f172a}.ok{fill:#047857}.bad{fill:#991b1b}</style><defs><marker id="arr-c2410c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0L10 5L0 10z" fill="#c2410c"/></marker></defs><text x="60" y="70.52" font-size="38" font-weight="700" fill="#0f172a"><tspan x="60" dy="0">Six search families. Same 153.</tspan></text><text x="60" y="106.25" font-size="18" fill="#475569"><tspan x="60" dy="0">The searches find real affected wallets or reproduce known ones, but none derives an unresolved source</tspan></text><rect x="70" y="160" width="400" height="110" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="98" y="208.53" font-size="20" font-weight="700" fill="#0f172a"><tspan x="98" dy="0">Derivation paths</tspan></text><text x="98" y="237.46" font-size="15" fill="#475569"><tspan x="98" dy="0">accounts · branches · indexes</tspan></text><rect x="495" y="160" width="400" height="110" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="523" y="208.53" font-size="20" font-weight="700" fill="#0f172a"><tspan x="523" dy="0">Device histories</tspan></text><text x="523" y="237.46" font-size="15" fill="#475569"><tspan x="523" dy="0">settings · migration · nine traces</tspan></text><rect x="70" y="295" width="400" height="110" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="98" y="343.53" font-size="20" font-weight="700" fill="#0f172a"><tspan x="98" dy="0">Added entropy</tspan></text><text x="98" y="372.46" font-size="15" fill="#475569"><tspan x="98" dy="0">one-to-three added dice rolls</tspan></text><rect x="495" y="295" width="400" height="110" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="523" y="343.53" font-size="20" font-weight="700" fill="#0f172a"><tspan x="523" dy="0">Pad ranges</tspan></text><text x="523" y="372.46" font-size="15" fill="#475569"><tspan x="523" dy="0">high words · full-pad samples</tspan></text><rect x="70" y="430" width="400" height="110" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="98" y="478.53" font-size="20" font-weight="700" fill="#0f172a"><tspan x="98" dy="0">Related wallets</tspan></text><text x="98" y="507.46" font-size="15" fill="#475569"><tspan x="98" dy="0">BIP85 · duress · Samourai</tspan></text><rect x="495" y="430" width="400" height="110" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="523" y="478.53" font-size="20" font-weight="700" fill="#0f172a"><tspan x="523" dy="0">Passphrases</tspan></text><text x="523" y="507.46" font-size="15" fill="#475569"><tspan x="523" dy="0">74 historically funded · 0 in Wave 1</tspan></text><path d="M900 350L1033 350" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" marker-end="url(#arr-c2410c)"/><rect x="1045" y="160" width="385" height="380" rx="22" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><text x="1080" y="209.21" font-size="15" font-weight="700" fill="#c2410c"><tspan x="1080" dy="0">RESULT</tspan></text><text x="1080" y="266.39" font-size="28" font-weight="700" fill="#0f172a"><tspan x="1080" dy="0">153 still unresolved</tspan></text><text x="1080" y="308.28" font-size="20" fill="#475569"><tspan x="1080" dy="0">132.94923662 BTC</tspan></text><text x="1080" y="380.36" font-