<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc"><title id="title">Intended and actual Coldcard RNG routing</title><desc id="desc">The seed request was intended to reach the STM32 hardware random number generator but linked to MicroPython's Yasmarang software fallback.</desc><rect width="1500" height="720" fill="#0f172a"/><style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.h{font-size:38px;font-weight:700;fill:#f1f5f9}.s{font-size:18px;fill:#94a3b8}.t{font-size:22px;font-weight:700;fill:#f1f5f9}.c{font-size:20px;font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,monospace;fill:#f1f5f9}.ok{fill:#6ee7b7}.bad{fill:#fca5a5}</style><text x="60" y="70" class="h"><tspan x="60" dy="0">The seed request never reached the hardware RNG</tspan></text><text x="60" y="105" class="s"><tspan x="60" dy="0">The same function name hid two different implementations across submodules</tspan></text><text x="170" y="160" font-size="22" font-weight="700" fill="#6ee7b7"><tspan x="170" dy="0">INTENDED ROUTE</tspan></text><rect x="70" y="190" width="550" height="80" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/><text x="345" y="237.3" text-anchor="middle" font-size="20" font-weight="500" style="font-family:&quot;JetBrains Mono&quot;,ui-monospace,SFMono-Regular,monospace" fill="#f1f5f9"><tspan x="345" dy="0">generate_seed → ngu.random.bytes(32)</tspan></text><rect x="70" y="330" width="550" height="80" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/><text x="345" y="377.3" text-anchor="middle" font-size="20" font-weight="500" style="font-family:&quot;JetBrains Mono&quot;,ui-monospace,SFMono-Regular,monospace" fill="#f1f5f9"><tspan x="345" dy="0">libngu → extern rng_get()</tspan></text><rect x="70" y="470" width="550" height="105" rx="16" fill="#052e2b" stroke="#34d399" stroke-width="2"/><text x="345" y="516.45" text-anchor="middle" font-size="22" font-weight="700" fill="#6ee7b7"><tspan x="345" dy="0">STM32 hardware TRNG</tspan></text><text x="345" y="545.98" text-anchor="middle" font-size="17" fill="#94a3b8"><tspan x="345" dy="0">fresh physical noise from RNG data register</tspan></text><path d="M345 275L345 325" fill="none" stroke="#6ee7b7" stroke-width="5" stroke-linecap="round"/><path d="M345 415L345 465" fill="none" stroke="#6ee7b7" stroke-width="5" stroke-linecap="round"/><text x="945" y="160" font-size="22" font-weight="700" fill="#fca5a5"><tspan x="945" dy="0">ACTUAL RELEASE ROUTE</tspan></text><rect x="880" y="190" width="550" height="80" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/><text x="1155" y="237.3" text-anchor="middle" font-size="20" font-weight="500" style="font-family:&quot;JetBrains Mono&quot;,ui-monospace,SFMono-Regular,monospace" fill="#f1f5f9"><tspan x="1155" dy="0">generate_seed → ngu.random.bytes(32)</tspan></text><rect x="880" y="330" width="550" height="80" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/><text x="1155" y="377.3" text-anchor="middle" font-size="20" font-weight="500" style="font-family:&quot;JetBrains Mono&quot;,ui-monospace,SFMono-Regular,monospace" fill="#f1f5f9"><tspan x="1155" dy="0">libngu → extern rng_get()</tspan></text><rect x="880" y="470" width="550" height="105" rx="16" fill="#450a0a" stroke="#f87171" stroke-width="2"/><text x="1155" y="516.45" text-anchor="middle" font-size="22" font-weight="700" fill="#fca5a5"><tspan x="1155" dy="0">MicroPython Yasmarang fallback</tspan></text><text x="1155" y="545.98" text-anchor="middle" font-size="17" fill="#94a3b8"><tspan x="1155" dy="0">UID ⊕ SysTick, zero RTC state</tspan></text><path d="M1155 275L1155 325" fill="none" stroke="#fca5a5" stroke-width="5" stroke-linecap="round"/><path d="M1155 415L1155 465" fill="none" stroke="#fca5a5" stroke-width="5" stroke-linecap="round"/><rect x="400" y="610" width="700" height="72" rx="16" fill="#3b2410" stroke="#fdba74" stroke-width="2"/><text x="750" y="639.25" text-anchor="middle" font-size="20" font-weight="500" style="font-family:&quot;JetBrains Mono&quot;,ui-monospace,SFMono-Regular,monospace" fill="#fdba74"><tspan x="750" dy="0">#define MICROPY_HW_ENABLE_RNG (0)</tspan></text><text x="750" y="668.18" text-anchor="middle" font-size="17" fill="#94a3b8"><tspan x="750" dy="0">The macro existed, so #ifndef did not stop the build</tspan></text></svg>