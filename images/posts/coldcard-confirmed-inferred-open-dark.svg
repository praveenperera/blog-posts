<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc"><title id="title">What the evidence supports, and what it does not</title><desc id="desc">Confirmed facts, chain inferences, and open questions stay in separate columns.</desc><rect width="1500" height="720" fill="#0f172a"/><style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.h{font-size:38px;font-weight:700;fill:#f1f5f9}.s{font-size:18px;fill:#94a3b8}.t{font-size:22px;font-weight:700;fill:#f1f5f9}.c{font-size:20px;font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,monospace;fill:#f1f5f9}.ok{fill:#6ee7b7}.bad{fill:#fca5a5}</style><rect x="0" y="0" width="1500" height="720" fill="#0f172a"/><text x="40" y="66.47" font-size="34" font-weight="700" fill="#f1f5f9"><tspan x="40" dy="0">What the evidence supports, and what it does not</tspan></text><text x="40" y="102.45" font-size="18" fill="#94a3b8"><tspan x="40" dy="0">Confirmed facts, chain inferences, and open questions stay in separate columns.</tspan></text><rect x="41" y="132.6" width="460.67" height="554.4" rx="15" fill="#052e2b" stroke="#34d399" stroke-width="2"/><text x="62" y="163.79" font-size="14" font-weight="700" letter-spacing="0.4" fill="#6ee7b7"><tspan x="62" dy="0">CONFIRMED</tspan></text><rect x="62.5" y="180.3" width="417.67" height="67" rx="11.5" fill="#1e293b" stroke="#334155" stroke-width="1"/><text x="79" y="209.22" font-size="16" fill="#94a3b8"><tspan x="79" dy="0">Seed path linked to Yasmarang, not STM32</tspan><tspan x="79" dy="20.8">TRNG</tspan></text><rect x="62.5" y="260.3" width="417.67" height="67" rx="11.5" fill="#1e293b" stroke="#334155" stroke-width="1"/><text x="79" y="299.62" font-size="16" fill="#94a3b8"><tspan x="79" dy="0">rng_get() reads UID, SysTick, and RTC state</tspan></text><rect x="62.5" y="340.3" width="417.67" height="67" rx="11.5" fill="#1e293b" stroke="#334155" stroke-width="1"/><text x="79" y="369.22" font-size="16" fill="#94a3b8"><tspan x="79" dy="0">Instagibbs confirmed the weakness on a real</tspan><tspan x="79" dy="20.8">Mk3</tspan></text><rect x="62.5" y="420.3" width="417.67" height="67" rx="11.5" fill="#1e293b" stroke="#334155" stroke-width="1"/><text x="79" y="459.62" font-size="16" fill="#94a3b8"><tspan x="79" dy="0">328 seeds map to 1,042 Wave 1 sources</tspan></text><rect x="62.5" y="500.3" width="417.67" height="67" rx="11.5" fill="#1e293b" stroke="#334155" stroke-width="1"/><text x="79" y="539.62" font-size="16" fill="#94a3b8"><tspan x="79" dy="0">Recovered pad high words lie between 15 and 75</tspan></text><rect x="519.67" y="132.6" width="460.67" height="554.4" rx="15" fill="#3b2410" stroke="#fdba74" stroke-width="2"/><text x="540.67" y="163.79" font-size="14" font-weight="700" letter-spacing="0.4" fill="#fdba74"><tspan x="540.67" dy="0">INFERRED</tspan></text><rect x="541.17" y="180.3" width="417.67" height="67" rx="11.5" fill="#1e293b" stroke="#334155" stroke-width="1"/><text x="557.67" y="209.22" font-size="16" fill="#94a3b8"><tspan x="557.67" dy="0">500-source branch: capped, value-ranked</tspan><tspan x="557.67" dy="20.8">queue</tspan></text><rect x="541.17" y="260.3" width="417.67" height="67" rx="11.5" fill="#1e293b" stroke="#334155" stroke-width="1"/><text x="557.67" y="299.62" font-size="16" fill="#94a3b8"><tspan x="557.67" dy="0">200-of-225 spend: one unprocessed API page</tspan></text><rect x="541.17" y="340.3" width="417.67" height="67" rx="11.5" fill="#1e293b" stroke="#334155" stroke-width="1"/><text x="557.67" y="379.62" font-size="16" fill="#94a3b8"><tspan x="557.67" dy="0">One shared tool built all three branches</tspan></text><rect x="541.17" y="420.3" width="417.67" height="67" rx="11.5" fill="#1e293b" stroke="#334155" stroke-width="1"/><text x="557.67" y="459.62" font-size="16" fill="#94a3b8"><tspan x="557.67" dy="0">The 153 preserve attacker-specific inputs</tspan></text><rect x="541.17" y="500.3" width="417.67" height="67" rx="11.5" fill="#1e293b" stroke="#334155" stroke-width="1"/><text x="557.67" y="539.62" font-size="16" fill="#94a3b8"><tspan x="557.67" dy="0">A simple larger-pad explanation is unlikely</tspan></text><rect x="998.33" y="132.6" width="460.67" height="554.4" rx="15" fill="#1e1b4b" stroke="#a5b4fc" stroke-width="2"/><text x="1019.33" y="163.79" font-size="14" font-weight="700" letter-spacing="0.4" fill="#c7d2fe"><tspan x="1019.33" dy="0">OPEN</tspan></text><rect x="1019.83" y="180.3" width="417.67" height="67" rx="11.5" fill="#1e293b" stroke="#334155" stroke-width="1"/><text x="1036.33" y="219.62" font-size="16" fill="#94a3b8"><tspan x="1036.33" dy="0">The operator's full derivation range</tspan></text><rect x="1019.83" y="260.3" width="417.67" height="67" rx="11.5" fill="#1e293b" stroke="#334155" stroke-width="1"/><text x="1036.33" y="299.62" font-size="16" fill="#94a3b8"><tspan x="1036.33" dy="0">Which API or indexer the attacker used</tspan></text><rect x="1019.83" y="340.3" width="417.67" height="67" rx="11.5" fill="#1e293b" stroke="#334155" stroke-width="1"/><text x="1036.33" y="379.62" font-size="16" fill="#94a3b8"><tspan x="1036.33" dy="0">Why later waves used different builders</tspan></text><rect x="1019.83" y="420.3" width="417.67" height="67" rx="11.5" fill="#1e293b" stroke="#334155" stroke-width="1"/><text x="1036.33" y="459.62" font-size="16" fill="#94a3b8"><tspan x="1036.33" dy="0">The seed model behind the 153</tspan></text><rect x="1019.83" y="500.3" width="417.67" height="67" rx="11.5" fill="#1e293b" stroke="#334155" stroke-width="1"/><text x="1036.33" y="539.62" font-size="16" fill="#94a3b8"><tspan x="1036.33" dy="0">Attacker identity and data sources</tspan></text></svg>