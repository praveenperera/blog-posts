<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc"><title id="title">UID and SysTick collapse into one pad, not two secrets</title><desc id="desc">XOR is not multiplication. Changing X only permutes pads that are already in the set.</desc><rect width="1500" height="720" fill="#0f172a"/><style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.h{font-size:38px;font-weight:700;fill:#f1f5f9}.s{font-size:18px;fill:#94a3b8}.t{font-size:22px;font-weight:700;fill:#f1f5f9}.c{font-size:20px;font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,monospace;fill:#f1f5f9}.ok{fill:#6ee7b7}.bad{fill:#fca5a5}</style><rect x="0" y="0" width="1500" height="720" fill="#0f172a"/><text x="40" y="66.47" font-size="34" font-weight="700" fill="#f1f5f9"><tspan x="40" dy="0">UID and SysTick collapse into one pad, not two secrets</tspan></text><text x="40" y="102.45" font-size="18" fill="#94a3b8"><tspan x="40" dy="0">XOR is not multiplication. Changing X only permutes pads that are already in the set.</tspan></text><rect x="41" y="132.6" width="387.45" height="119" rx="15" fill="#1e293b" stroke="#334155" stroke-width="2"/><text x="62" y="163.79" font-size="14" font-weight="700" letter-spacing="0.4" fill="#93c5fd"><tspan x="62" dy="0">UID[0]</tspan></text><text x="62" y="200.08" font-size="20" font-weight="700" fill="#f1f5f9"><tspan x="62" dy="0">wafer-position fields</tspan></text><text x="62" y="230.04" font-size="16" font-weight="500" style="font-family:&quot;JetBrains Mono&quot;,ui-monospace,SFMono-Regular,monospace" fill="#94a3b8"><tspan x="62" dy="0">(y &lt;&lt; 16) | x</tspan></text><text x="451.68" y="198.65" font-size="18" font-weight="700" fill="#f1f5f9"><tspan x="451.68" dy="0">XOR</tspan></text><rect x="514.45" y="132.6" width="387.45" height="119" rx="15" fill="#1e293b" stroke="#334155" stroke-width="2"/><text x="535.45" y="163.79" font-size="14" font-weight="700" letter-spacing="0.4" fill="#93c5fd"><tspan x="535.45" dy="0">SysTick</tspan></text><text x="535.45" y="200.08" font-size="20" font-weight="700" fill="#f1f5f9"><tspan x="535.45" dy="0">bounded timer</tspan></text><text x="535.45" y="230.04" font-size="16" font-weight="500" style="font-family:&quot;JetBrains Mono&quot;,ui-monospace,SFMono-Regular,monospace" fill="#94a3b8"><tspan x="535.45" dy="0">[0, 80,000)</tspan></text><text x="924.99" y="199.38" font-size="20" font-weight="700" fill="#93c5fd"><tspan x="924.99" dy="0">-&gt;</tspan></text><rect x="967.91" y="132.6" width="491.09" height="119" rx="15" fill="#1e1b4b" stroke="#a5b4fc" stroke-width="2"/><text x="988.91" y="163.79" font-size="14" font-weight="700" letter-spacing="0.4" fill="#93c5fd"><tspan x="988.91" dy="0">ONE 32-BIT PAD</tspan></text><text x="988.91" y="200.08" font-size="20" font-weight="700" fill="#f1f5f9"><tspan x="988.91" dy="0">pad = UID[0] XOR SysTick</tspan></text><text x="988.91" y="230.02" font-size="16" fill="#94a3b8"><tspan x="988.91" dy="0">high word observed 15–75 · Wave 1 max 74</tspan></text><rect x="41" y="269.6" width="700" height="325.8" rx="15" fill="#450a0a" stroke="#f87171" stroke-width="2"/><text x="62" y="300.79" font-size="14" font-weight="700" letter-spacing="0.4" fill="#fca5a5"><tspan x="62" dy="0">NAIVE PRODUCT</tspan></text><text x="62" y="351.21" font-size="30" font-weight="700" fill="#f1f5f9"><tspan x="62" dy="0">90 × 90 × 80,000</tspan></text><text x="62" y="392.08" font-size="20" font-weight="700" fill="#f1f5f9"><tspan x="62" dy="0">648,000,000 input tuples</tspan></text><text x="62" y="426.02" font-size="16" fill="#94a3b8"><tspan x="62" dy="0">counts many pairs that collapse to the same pad</tspan></text><rect x="759" y="269.6" width="700" height="325.8" rx="15" fill="#052e2b" stroke="#34d399" stroke-width="2"/><text x="780" y="300.79" font-size="14" font-weight="700" letter-spacing="0.4" fill="#6ee7b7"><tspan x="780" dy="0">UNIQUE IMAGE</tspan></text><text x="780" y="351.21" font-size="30" font-weight="700" fill="#f1f5f9"><tspan x="780" dy="0">90 × 65,536</tspan></text><text x="780" y="392.08" font-size="20" font-weight="700" fill="#f1f5f9"><tspan x="780" dy="0">5,898,240 unique pads ~ 2^22.49</tspan></text><text x="780" y="426.02" font-size="16" fill="#94a3b8"><tspan x="780" dy="0">conditional model, not a measured UID factory bound</tspan></text><rect x="41" y="611.4" width="1418" height="75.6" rx="15" fill="#1e293b" stroke="#334155" stroke-width="2"/><text x="62" y="644.62" font-size="16" fill="#94a3b8"><tspan x="62" dy="0">SysTick covers every low 16-bit value, so X does not add a new pad dimension. Its next bit can flip the low bit of the high word, so pad_high is not an exact physical Y. RTC is</tspan><tspan x="62" dy="20.8">zero on this Mk3 cold-start path.</tspan></text></svg>