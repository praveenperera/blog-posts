<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc"><title id="title">Current reconstruction of the Wave 1 RNG search</title><desc id="desc">Recovered Wave 1 seeds fit a canonical zero-RTC model with no added dice, divided into three scan-count ranges and followed by standard Bitcoin address derivation. The final 153 sources remain unresolved.</desc><rect width="1500" height="720" fill="#0f172a"/><style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.h{font-size:38px;font-weight:700;fill:#f1f5f9}.s{font-size:18px;fill:#94a3b8}.t{font-size:22px;font-weight:700;fill:#f1f5f9}.c{font-size:20px;font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,monospace;fill:#f1f5f9}.ok{fill:#6ee7b7}.bad{fill:#fca5a5}</style><defs><marker id="arr-c7d2fe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0L10 5L0 10z" fill="#c7d2fe"/></marker></defs><text x="60" y="65" class="h"><tspan x="60" dy="0">What the recovered RNG paths suggest</tspan></text><text x="60" y="102" class="s"><tspan x="60" dy="0">Candidate coordinates describe a successful search model, not one exact physical device history</tspan></text><rect x="45" y="155" width="340" height="250" rx="22" fill="#1e293b" stroke="#334155" stroke-width="2"/><text x="75" y="195.21" font-size="15" font-weight="700" fill="#93c5fd"><tspan x="75" dy="0">SUCCESSFUL CANDIDATE MODEL</tspan></text><text x="75" y="236.33" font-size="24" font-weight="700" fill="#f1f5f9"><tspan x="75" dy="0">Narrow device state</tspan></text><text x="75" y="280.25" font-size="18" fill="#94a3b8"><tspan x="75" dy="0">canonical pad range</tspan></text><text x="75" y="319.25" font-size="18" fill="#94a3b8"><tspan x="75" dy="0">zero initial RTC</tspan></text><text x="75" y="358.25" font-size="18" fill="#94a3b8"><tspan x="75" dy="0">no added dice rolls</tspan></text><rect x="430" y="155" width="635" height="250" rx="22" fill="#1e293b" stroke="#334155" stroke-width="2"/><text x="476" y="195.21" font-size="15" font-weight="700" fill="#93c5fd"><tspan x="476" dy="0">SCAN-SESSION RANGE PARTITIONS</tspan></text><rect x="460" y="220" width="575" height="48" rx="12" fill="#172554" stroke="#60a5fa" stroke-width="2"/><text x="485" y="250.23" font-size="17" font-weight="700" fill="#f1f5f9"><tspan x="485" dy="0">8–19</tspan></text><text x="675" y="250.25" font-size="18" fill="#94a3b8"><tspan x="675" dy="0">Original 500</tspan></text><text x="910" y="249.21" font-size="15" fill="#94a3b8"><tspan x="910" dy="0">swept last</tspan></text><rect x="460" y="280" width="575" height="48" rx="12" fill="#1e1b4b" stroke="#a5b4fc" stroke-width="2"/><text x="485" y="310.23" font-size="17" font-weight="700" fill="#f1f5f9"><tspan x="485" dy="0">20–39</tspan></text><text x="675" y="310.25" font-size="18" fill="#94a3b8"><tspan x="675" dy="0">Holding 2</tspan></text><text x="910" y="309.21" font-size="15" fill="#94a3b8"><tspan x="910" dy="0">swept second</tspan></text><rect x="460" y="340" width="575" height="48" rx="12" fill="#2e1065" stroke="#6d28d9" stroke-width="2"/><text x="485" y="370.23" font-size="17" font-weight="700" fill="#f1f5f9"><tspan x="485" dy="0">40–48 and 52</tspan></text><text x="675" y="370.25" font-size="18" fill="#94a3b8"><tspan x="675" dy="0">Holding 3</tspan></text><text x="910" y="369.21" font-size="15" fill="#94a3b8"><tspan x="910" dy="0">swept first</tspan></text><rect x="1110" y="155" width="345" height="250" rx="22" fill="#1e293b" stroke="#334155" stroke-width="2"/><text x="1140" y="195.21" font-size="15" font-weight="700" fill="#93c5fd"><tspan x="1140" dy="0">REACHED ADDRESS PATHS</tspan></text><text x="1140" y="236.33" font-size="24" font-weight="700" fill="#f1f5f9"><tspan x="1140" dy="0">Standard Bitcoin</tspan></text><text x="1140" y="280.25" font-size="18" fill="#94a3b8"><tspan x="1140" dy="0">BIP44, BIP49, BIP84</tspan></text><text x="1140" y="319.25" font-size="18" fill="#94a3b8"><tspan x="1140" dy="0">accounts 0–4</tspan></text><text x="1140" y="358.25" font-size="18" fill="#94a3b8"><tspan x="1140" dy="0">receive and change</tspan></text><text x="1140" y="397.25" font-size="18" fill="#94a3b8"><tspan x="1140" dy="0">indexes through 234</tspan></text><path d="M389 280L418 280" fill="none" stroke="#c7d2fe" stroke-width="4" stroke-linecap="round" marker-end="url(#arr-c7d2fe)"/><path d="M1069 280L1098 280" fill="none" stroke="#c7d2fe" stroke-width="4" stroke-linecap="round" marker-end="url(#arr-c7d2fe)"/><rect x="75" y="460" width="635" height="210" rx="22" fill="#3b2410" stroke="#fdba74" stroke-width="2"/><text x="110" y="505.21" font-size="15" font-weight="700" fill="#fdba74"><tspan x="110" dy="0">NOT OBSERVED IN RECOVERED WAVE 1</tspan></text><text x="110" y="549.23" font-size="17" font-weight="700" fill="#f1f5f9"><tspan x="110" dy="0">Added rolls 1–2</tspan></text><text x="390" y="548.72" font-size="16" fill="#94a3b8"><tspan x="390" dy="0">0 Wave 1 seeds in completed scope</tspan></text><text x="110" y="585.23" font-size="17" font-weight="700" fill="#f1f5f9"><tspan x="110" dy="0">Scan counts 53–100</tspan></text><text x="390" y="584.72" font-size="16" fill="#94a3b8"><tspan x="390" dy="0">funded seeds exist outside Wave 1</tspan></text><text x="110" y="621.23" font-size="17" font-weight="700" fill="#f1f5f9"><tspan x="110" dy="0">Pad high word above 74</tspan></text><text x="390" y="620.72" font-size="16" fill="#94a3b8"><tspan x="390" dy="0">0 recovered Wave 1 seeds</tspan></text><rect x="790" y="460" width="635" height="210" rx="22" fill="#052e2b" stroke="#34d399" stroke-width="2"/><text x="825" y="505.21" font-size="15" font-weight="700" fill="#6ee7b7"><tspan x="825" dy="0">CURRENT RECONSTRUCTION</tspan></text><text x="825" y="560.25" font-size="18" fill="#94a3b8"><tspan x="825" dy="0">No added dice; jobs divided by scan-session count</tspan></text><text x="825" y="605.25" font-size="18" fill="#94a3b8"><tspan x="825" dy="0">Address records became the unit of work</tspan></text><text x="825" y="647.21" font-size="15" fill="#94a3b8"><tspan x="825" dy="0">The unresolved 153 may change this reconstruction</tspan></text></svg>