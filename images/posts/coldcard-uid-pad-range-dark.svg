<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc"><title id="title">Coldcard UID, SysTick, and recovered pad range</title><desc id="desc">UID and SysTick combine through XOR. Recovered pad high words lie from 15 through 75.</desc><rect width="1500" height="720" fill="#0f172a"/><style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.h{font-size:38px;font-weight:700;fill:#f1f5f9}.s{font-size:18px;fill:#94a3b8}.t{font-size:22px;font-weight:700;fill:#f1f5f9}.c{font-size:20px;font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,monospace;fill:#f1f5f9}.ok{fill:#6ee7b7}.bad{fill:#fca5a5}</style><defs><marker id="arr-c7d2fe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0L10 5L0 10z" fill="#c7d2fe"/></marker></defs><text x="60" y="70.52" font-size="38" font-weight="700" fill="#f1f5f9"><tspan x="60" dy="0">The recovered state occupies a narrow pad band</tspan></text><text x="60" y="106.25" font-size="18" fill="#94a3b8"><tspan x="60" dy="0">Pad high word is observable in the model; it is not an exact physical UID coordinate</tspan></text><rect x="70" y="150" width="350" height="120" rx="18" fill="#1e293b" stroke="#334155" stroke-width="2"/><text x="106" y="206.3" font-size="22" font-weight="700" fill="#f1f5f9"><tspan x="106" dy="0">UID[0]</tspan></text><text x="106" y="230.85" font-size="18" fill="#94a3b8"><tspan x="106" dy="0">wafer-position fields</tspan></text><rect x="575" y="150" width="350" height="120" rx="18" fill="#1e293b" stroke="#334155" stroke-width="2"/><text x="611" y="206.3" font-size="22" font-weight="700" fill="#f1f5f9"><tspan x="611" dy="0">SysTick</tspan></text><text x="611" y="230.85" font-size="18" fill="#94a3b8"><tspan x="611" dy="0">bounded timer state</tspan></text><rect x="1080" y="150" width="350" height="120" rx="18" fill="#1e293b" stroke="#334155" stroke-width="2"/><text x="1116" y="194.6" font-size="22" font-weight="700" fill="#f1f5f9"><tspan x="1116" dy="0">pad = UID[0] ⊕ SysTick</tspan></text><text x="1116" y="219.15" font-size="18" fill="#94a3b8"><tspan x="1116" dy="0">one 32-bit result</tspan></text><text x="1116" y="242.55" font-size="18" fill="#94a3b8"><tspan x="1116" dy="0">not additive entropy</tspan></text><text x="497.5" y="220.91" text-anchor="middle" font-size="30" font-weight="700" fill="#f1f5f9"><tspan x="497.5" dy="0">⊕</tspan></text><path d="M930 210L1068 210" fill="none" stroke="#c7d2fe" stroke-width="5" stroke-linecap="round" marker-end="url(#arr-c7d2fe)"/><text x="70" y="314.3" font-size="22" font-weight="700" fill="#f1f5f9"><tspan x="70" dy="0">853 public campaign findings by pad high-word band</tspan></text><rect x="157.77" y="453.2" width="142.68" height="136.8" rx="8" fill="#93c5fd"/><rect x="353.22" y="365" width="142.68" height="225" rx="8" fill="#93c5fd"/><rect x="548.66" y="435.2" width="142.68" height="154.8" rx="8" fill="#93c5fd"/><rect x="744.11" y="381.2" width="142.68" height="208.8" rx="8" fill="#93c5fd"/><rect x="939.55" y="547.7" width="142.68" height="42.3" rx="8" fill="#93c5fd"/><text x="229.11" y="439.5" text-anchor="middle" font-size="22" font-weight="700" fill="#f1f5f9"><tspan x="229.11" dy="0">152</tspan></text><text x="424.55" y="351.3" text-anchor="middle" font-size="22" font-weight="700" fill="#f1f5f9"><tspan x="424.55" dy="0">250</tspan></text><text x="620" y="421.5" text-anchor="middle" font-size="22" font-weight="700" fill="#f1f5f9"><tspan x="620" dy="0">172</tspan></text><text x="815.45" y="367.5" text-anchor="middle" font-size="22" font-weight="700" fill="#f1f5f9"><tspan x="815.45" dy="0">232</tspan></text><text x="1010.89" y="534" text-anchor="middle" font-size="22" font-weight="700" fill="#f1f5f9"><tspan x="1010.89" dy="0">47</tspan></text><path d="M105 590H1135" fill="none" stroke="#334155" stroke-width="2"/><path d="M229.11 590V596" fill="none" stroke="#334155" stroke-width="2"/><text x="229.11" y="617.21" text-anchor="middle" font-size="15" font-weight="400" fill="#94a3b8"><tspan x="229.11" dy="0">15–29</tspan></text><path d="M424.55 590V596" fill="none" stroke="#334155" stroke-width="2"/><text x="424.55" y="617.21" text-anchor="middle" font-size="15" font-weight="400" fill="#94a3b8"><tspan x="424.55" dy="0">30–44</tspan></text><path d="M620 590V596" fill="none" stroke="#334155" stroke-width="2"/><text x="620" y="617.21" text-anchor="middle" font-size="15" font-weight="400" fill="#94a3b8"><tspan x="620" dy="0">45–59</tspan></text><path d="M815.45 590V596" fill="none" stroke="#334155" stroke-width="2"/><text x="815.45" y="617.21" text-anchor="middle" font-size="15" font-weight="400" fill="#94a3b8"><tspan x="815.45" dy="0">60–69</tspan></text><path d="M1010.89 590V596" fill="none" stroke="#334155" stroke-width="2"/><text x="1010.89" y="617.21" text-anchor="middle" font-size="15" font-weight="400" fill="#94a3b8"><tspan x="1010.89" dy="0">70–75</tspan></text><rect x="1175" y="330" width="255" height="220" rx="20" fill="#1e1b4b" stroke="#a5b4fc" stroke-width="2"/><text x="1205" y="374.3" font-size="22" font-weight="700" fill="#f1f5f9"><tspan x="1205" dy="0">Recovered bounds</tspan></text><text x="1205" y="434.41" font-size="30" font-weight="700" fill="#f1f5f9"><tspan x="1205" dy="0">15–75</tspan></text><text x="1205" y="466.25" font-size="18" fill="#94a3b8"><tspan x="1205" dy="0">Wave 1 max: 74</tspan></text><text x="1205" y="506.25" font-size="18" fill="#94a3b8"><tspan x="1205" dy="0">Only 3 findings at 75</tspan></text><rect x="70" y="650" width="1360" height="44" rx="14" fill="#172554"/><text x="105" y="679.3" font-size="20" font-weight="500" style="font-family:&quot;JetBrains Mono&quot;,ui-monospace,SFMono-Regular,monospace" fill="#f1f5f9"><tspan x="105" dy="0">bounded XOR image: 90 × 65,536 = 5,898,240 unique pads ≈ 2^22.49</tspan></text></svg>