<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc"><title id="title">Inferred Wave 1 attacker pipeline</title><desc id="desc">Weak seed candidates become address records, a value-ranked work list, reverse-ordered UTXOs, and one sweep transaction per source address.</desc><rect width="1500" height="720" fill="#0f172a"/><style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.h{font-size:38px;font-weight:700;fill:#f1f5f9}.s{font-size:18px;fill:#94a3b8}.t{font-size:22px;font-weight:700;fill:#f1f5f9}.c{font-size:20px;font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,monospace;fill:#f1f5f9}.ok{fill:#6ee7b7}.bad{fill:#fca5a5}</style><defs><marker id="arr-c7d2fe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0L10 5L0 10z" fill="#c7d2fe"/></marker></defs><text x="60" y="70" class="h"><tspan x="60" dy="0">Wave 1 looks like an address-record pipeline</tspan></text><text x="60" y="105" class="s"><tspan x="60" dy="0">The chain proves the output shape; the upstream implementation remains inference</tspan></text><rect x="45" y="210" width="195" height="170" rx="20" fill="#1e293b" stroke="#334155" stroke-width="2"/><text x="70" y="250.21" font-size="15" font-weight="700" fill="#93c5fd"><tspan x="70" dy="0">INFERRED</tspan></text><text x="70" y="285.28" font-size="20" font-weight="700" fill="#f1f5f9"><tspan x="70" dy="0">Weak seeds</tspan></text><text x="70" y="317.22" font-size="16" fill="#94a3b8"><tspan x="70" dy="0">candidate stream</tspan></text><rect x="288" y="210" width="195" height="170" rx="20" fill="#1e293b" stroke="#334155" stroke-width="2"/><text x="313" y="250.21" font-size="15" font-weight="700" fill="#93c5fd"><tspan x="313" dy="0">INFERRED</tspan></text><text x="313" y="285.28" font-size="20" font-weight="700" fill="#f1f5f9"><tspan x="313" dy="0">Child keys</tspan></text><text x="313" 