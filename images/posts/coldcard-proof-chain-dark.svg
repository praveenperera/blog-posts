<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc"><title id="title">Evidence for the Coldcard weak RNG path</title><desc id="desc">Source analysis, Instagibbs' real Mk3 test, and reconstructed Wave 1 addresses support the same weak RNG model.</desc><rect width="1500" height="720" fill="#0f172a"/><style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.h{font-size:38px;font-weight:700;fill:#f1f5f9}.s{font-size:18px;fill:#94a3b8}.t{font-size:22px;font-weight:700;fill:#f1f5f9}.c{font-size:20px;font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,monospace;fill:#f1f5f9}.ok{fill:#6ee7b7}.bad{fill:#fca5a5}</style><defs><marker id="arr-c7d2fe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0L10 5L0 10z" fill="#c7d2fe"/></marker></defs><text x="60" y="70.52" font-size="38" font-weight="700" fill="#f1f5f9"><tspan x="60" dy="0">Source analysis and a real Mk3 test agree</tspan></text><text x="60" y="106.25" font-size="18" fill="#94a3b8"><tspan x="60" dy="0">The on-chain matches extend the same model across Wave 1</tspan></text><rect x="140" y="160" width="500" height="210" rx="22" fill="#1e293b" stroke="#334155" stroke-width="2"/><text x="180" y="221.77" font-size="16" font-weight="700" fill="#93c5fd"><tspan x="180" dy="0">1 · SOURCE TRACE</tspan></text><text x="180" y="261.64" font-size="21" font-weight="700" fill="#f1f5f9"><tspan x="180" dy="0">Coldcard → libngu → MicroPython</tspan></text><text x="180" y="295.9" font-size="18" fill="#94a3b8"><tspan x="180" dy="0">The build selects the software</tspan></text><text x="180" y="319.3" font-size="18" fill="#94a3b8"><tspan x="180" dy="0">rng_get() fallback</tspan></text><rect x="860" y="160" width="500" height="210" rx="22" fill="#1e293b" stroke="#334155" stroke-width="2"/><text x="900" y="221.77" font-size="16" font-weight="700" fill="#93c5fd"><tspan x="900" dy="0">2 · DEVICE TEST</tspan></text><text x="900" y="261.64" font-size="21" font-weight="700" fill="#f1f5f9"><tspan x="900" dy="0">Instagibbs' Mk3</tspan></text><text x="900" y="295.9" font-size="18" fill="#94a3b8"><tspan x="900" dy="0">Root recovered from its public xpub</tspan></text><text x="900" y="319.3" font-size="18" fill="#94a3b8"><tspan x="900" dy="0">after 12 setup button presses</tspan></text><path d="M390 375L390 456" fill="none" stroke="#c7d2fe" stroke-width="5" stroke-linecap="round" marker-end="url(#arr-c7d2fe)"/><path d="M1110 375L1110 456" fill="none" stroke="#c7d2fe" stroke-width="5" stroke-linecap="round" marker-end="url(#arr-c7d2fe)"/><rect x="280" y="470" width="940" height="165" rx="26" fill="#052e2b" stroke="#34d399" stroke-width="2"/><text x="320" y="515.12" font-size="16" font-weight="700" fill="#6ee7b7"><tspan x="320" dy="0">ON-CHAIN RESULT</tspan></text><text x="320" y="564.11" font-size="30" font-weight="700" fill="#f1f5f9"><tspan x="320" dy="0">328 reconstructed seeds → 1,042 Wave 1 sources</tspan></text><text x="320" y="600.95" font-size="18" fill="#94a3b8"><tspan x="320" dy="0">949.70395260 BTC matched through independent public-key derivation</tspan></text></svg>