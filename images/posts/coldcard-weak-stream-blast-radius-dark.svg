<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc"><title id="title">The weak stream did not make every secret recoverable</title><desc id="desc">Damage follows the call path. Backups and ordinary ECDSA nonces did not use ngu.random.</desc><rect width="1500" height="720" fill="#0f172a"/><style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.h{font-size:38px;font-weight:700;fill:#f1f5f9}.s{font-size:18px;fill:#94a3b8}.t{font-size:22px;font-weight:700;fill:#f1f5f9}.c{font-size:20px;font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,monospace;fill:#f1f5f9}.ok{fill:#6ee7b7}.bad{fill:#fca5a5}</style><rect x="0" y="0" width="1500" height="720" fill="#0f172a"/><text x="40" y="66.47" font-size="34" font-weight="700" fill="#f1f5f9"><tspan x="40" dy="0">The weak stream did not make every secret recoverable</tspan></text><text x="40" y="102.45" font-size="18" fill="#94a3b8"><tspan x="40" dy="0">Damage follows the call path. Backups and ordinary ECDSA nonces did not use ngu.random.</tspan></text><rect x="41" y="132.6" width="871.85" height="57.4" rx="15" fill="#450a0a" stroke="#f87171" stroke-width="2"/><text x="62" y="167.85" font-size="18" font-weight="700" fill="#f1f5f9"><tspan x="62" dy="0">WEAK STREAM · ngu.random · Yasmarang</tspan></text><rect x="928.85" y="132.6" width="530.15" height="57.4" rx="15" fill="#052e2b" stroke="#34d399" stroke-width="2"/><text x="949.85" y="167.85" font-size="18" font-weight="700" fill="#f1f5f9"><tspan x="949.85" dy="0">HARDWARE · ckcc.rng_bytes</tspan></text><rect x="41" y="204" width="481" height="105.8" rx="15" fill="#450a0a" stroke="#f87171" stroke-width="2"/><text x="62" y="235.19" font-size="14" font-weight="700" letter-spacing="0.4" fill="#fca5a5"><tspan x="62" dy="0">CATASTROPHIC</tspan></text><text x="62" y="265.45" font-size="18" font-weight="700" fill="#f1f5f9"><tspan x="62" dy="0">Normal Mk3 seed generation</tspan></text><text x="62" y="288.79" font-size="14" fill="#94a3b8"><tspan x="62" dy="0">root becomes enumerable</tspan></text><rect x="534" y="204" width="481" height="105.8" rx="15" fill="#3b2410" stroke="#fdba74" stroke-width="2"/><text x="555" y="235.19" font-size="14" font-weight="700" letter-spacing="0.4" fill="#fdba74"><tspan x="555" dy="0">CAVEAT</tspan></text><text x="555" y="265.45" font-size="18" font-weight="700" fill="#f1f5f9"><tspan x="555" dy="0">BIP340 Schnorr auxiliary data</tspan></text><text x="555" y="288.79" font-size="14" fill="#94a3b8"><tspan x="555" dy="0">weakens side-channel defenses</tspan></text><rect x="41" y="321.8" width="481" height="105.8" rx="15" fill="#3b2410" stroke="#fdba74" stroke-width="2"/><text x="62" y="352.99" font-size="14" font-weight="700" letter-spacing="0.4" fill="#fdba74"><tspan x="62" dy="0">CAVEAT</tspan></text><text x="62" y="383.25" font-size="18" font-weight="700" fill="#f1f5f9"><tspan x="62" dy="0">Edge 6.5.0 MuSig2 session data</tspan></text><text x="62" y="406.59" font-size="14" fill="#94a3b8"><tspan x="62" dy="0">can break unique-nonce rule</tspan></text><rect x="534" y="321.8" width="481" height="105.8" rx="15" fill="#3b2410" stroke="#fdba74" stroke-width="2"/><text x="555" y="352.99" font-size="14" font-weight="700" letter-spacing="0.4" fill="#fdba74"><tspan x="555" dy="0">CAVEAT</tspan></text><text x="555" y="383.25" font-size="18" font-weight="700" fill="#f1f5f9"><tspan x="555" dy="0">libsecp256k1 context blinding</tspan></text><text x="555" y="406.59" font-size="14" fill="#94a3b8"><tspan x="555" dy="0">does not change ECDSA nonce</tspan></text><rect x="41" y="439.6" width="974" height="105.8" rx="15" fill="#052e2b" stroke="#34d399" stroke-width="2"/><text x="62" y="470.79" font-size="14" font-weight="700" letter-spacing="0.4" fill="#6ee7b7"><tspan x="62" dy="0">UNAFFECTED BY DESIGN</tspan></text><text x="62" y="501.05" font-size="18" font-weight="700" fill="#f1f5f9"><tspan x="62" dy="0">Standard Bitcoin ECDSA signing</tspan></text><text x="62" y="524.39" font-size="14" fill="#94a3b8"><tspan x="62" dy="0">libsecp256k1 uses deterministic RFC 6979 nonces</tspan></text><rect x="1031" y="204" width="428" height="153" rx="15" fill="#052e2b" stroke="#34d399" stroke-width="2"/><text x="1052" y="235.19" font-size="14" font-weight="700" letter-spacing="0.4" fill="#6ee7b7"><tspan x="1052" dy="0">HARDWARE PATH</tspan></text><text x="1052" y="265.45" font-size="18" font-weight="700" fill="#f1f5f9"><tspan x="1052" dy="0">Backup passwords</tspan></text><text x="1052" y="288.79" font-size="14" fill="#94a3b8"><tspan x="1052" dy="0">separate STM32 TRNG</tspan></text><rect x="1031" y="369" width="428" height="153" rx="15" fill="#052e2b" stroke="#34d399" stroke-width="2"/><text x="1052" y="400.19" font-size="14" font-weight="700" letter-spacing="0.4" fill="#6ee7b7"><tspan x="1052" dy="0">HARDWARE PATH</tspan></text><text x="1052" y="430.45" font-size="18" font-weight="700" fill="#f1f5f9"><tspan x="1052" dy="0">7z salt and 7z IV</tspan></text><text x="1052" y="453.79" font-size="14" fill="#94a3b8"><tspan x="1052" dy="0">same hardware RNG path</tspan></text><rect x="1031" y="534" width="428" height="153" rx="15" fill="#1e293b" stroke="#334155" stroke-width="2"/><text x="1052" y="565.19" font-size="14" font-weight="700" letter-spacing="0.4" fill="#93c5fd"><tspan x="1052" dy="0">ALSO SAFE</tspan></text><text x="1052" y="595.45" font-size="18" font-weight="700" fill="#f1f5f9"><tspan x="1052" dy="0">Imported and dice-only seeds</tspan></text><text x="1052" y="618.79" font-size="14" fill="#94a3b8"><tspan x="1052" dy="0">they never used this route</tspan></text></svg>