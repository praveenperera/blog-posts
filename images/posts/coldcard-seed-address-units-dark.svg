<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="400" viewBox="0 0 1500 400" role="img" aria-labelledby="title desc"><title id="title">The unit of work was the address, not the wallet</title><desc id="desc">One seed can derive many source addresses. Wave 1 swept each address in a separate transaction.</desc><rect width="1500" height="400" fill="#0f172a"/><style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.h{font-size:38px;font-weight:700;fill:#f1f5f9}.s{font-size:18px;fill:#94a3b8}.t{font-size:22px;font-weight:700;fill:#f1f5f9}.c{font-size:20px;font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,monospace;fill:#f1f5f9}.ok{fill:#6ee7b7}.bad{fill:#fca5a5}</style><rect x="0" y="0" width="1500" height="400" fill="#0f172a"/><text x="40" y="66.47" font-size="34" font-weight="700" fill="#f1f5f9"><tspan x="40" dy="0">The unit of work was the address, not the wallet</tspan></text><text x="40" y="102.45" font-size="18" fill="#94a3b8"><tspan x="40" dy="0">One seed can derive many source addresses. Wave 1 swept each address in a separate transaction.</tspan></text><rect x="41" y="132.6" width="278" height="234.4" rx="15" fill="#1e1b4b" stroke="#a5b4fc" stroke-width="2"/><text x="62" y="163.79" font-size="14" font-weight="700" letter-spacing="0.4" fill="#93c5fd"><tspan x="62" dy="0">SEED</tspan></text><text x="62" y="208.19" font-size="28" font-weight="700" fill="#f1f5f9"><tspan x="62" dy="0">1 root</tspan></text><text x="62" y="240.42" font-size="16" fill="#94a3b8"><tspan x="62" dy="0">median 2 sources</tspan></text><text x="62" y="261.22" font-size="16" fill="#94a3b8"><tspan x="62" dy="0">maximum 58 sources</tspan></text><rect x="381" y="139.63" width="228" height="57.4" rx="15" fill="#1e293b" stroke="#334155" stroke-width="2"/><text x="402" y="174.88" font-size="18" font-weight="700" fill="#f1f5f9"><tspan x="402" dy="0">address A</tspan></text><rect x="620" y="167.33" width="40" height="2" fill="#94a3b8"/><rect x="668" y="153.33" width="18" heig