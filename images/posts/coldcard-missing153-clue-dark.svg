<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc"><title id="title">Eight search families, the same unresolved 153</title><desc id="desc">Wider paths, device histories, dice, pad ranges, related wallets, passphrases, 12-word seeds, and paper wallets all fail to derive one of the 153 unresolved Wave 1 sources.</desc><rect width="1500" height="720" fill="#0f172a"/><style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.h{font-size:38px;font-weight:700;fill:#f1f5f9}.s{font-size:18px;fill:#94a3b8}.t{font-size:22px;font-weight:700;fill:#f1f5f9}.c{font-size:20px;font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,monospace;fill:#f1f5f9}.ok{fill:#6ee7b7}.bad{fill:#fca5a5}</style><defs><marker id="arr-fdba74" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0L10 5L0 10z" fill="#fdba74"/></marker></defs><text x="60" y="70.52" font-size="38" font-weight="700" fill="#f1f5f9"><tspan x="60" dy="0">Eight search families. Same 153.</tspan></text><text x="60" y="106.25" font-size="18" fill="#94a3b8"><tspan x="60" dy="0">The searches find real affected wallets or reproduce known ones, but none derives an unresolved source</tspan></text><rect x="70" y="160" width="400" height="110" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/><text x="98" y="208.53" font-size="20" font-weight="700" fill="#f1f5f9"><tspan x="98" dy="0">Derivation paths</tspan></text><text x="98" y="237.46" font-size="15" fill="#94a3b8"><tspan x="98" dy="0">accounts · branches · indexes</tspan></text><rect x="495" y="160" width="400" height="110" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/><text x="523" y="208.53" font-size="20" font-weight="700" fill="#f1f5f9"><tspan x="523" dy="0">Device histories</tspan></text><text x="523" y="237.46" font-size="15" fill="#94a3b8"><tspan x="523" dy="0">settings · migration · nine traces</tspan></text><rect x="70" y="295" width="400" height="110" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/><text x="98" y="343.53" font-size="20" font-weight="700" fill="#f1f5f9"><tspan x="98" dy="0">Added entropy</tspan></text><text x="98" y="372.46" font-size="15" fill="#94a3b8"><tspan x="98" dy="0">one-to-three added dice rolls</tspan></text><rect x="495" y="295" width="400" height="110" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/><text x="523" y="343.53" font-size="20" font-weight="700" fill="#f1f5f9"><tspan x="523" dy="0">Pad ranges</tspan></text><text x="523" y="372.46" font-size="15" fill="#94a3b8"><tspan x="523" dy="0">high words · full-pad samples</tspan></text><rect x="70" y="430" width="400" height="110" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/><text x="98" y="478.53" font-size="20" font-weight="700" fill="#f1f5f9"><tspan x="98" dy="0">Related wallets</tspan></text><text x="98" y="507.46" font-size="15" fill="#94a3b8"><tspan x="98" dy="0">BIP85 · duress · Samourai</tspan></text><rect x="495" y="430" width="400" height="110" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/><text x="523" y="478.53" font-size="20" font-weight="700" fill="#f1f5f9"><tspan x="523" dy="0">Passphrases</tspan></text><text x="523" y="507.46" font-size="15" fill="#94a3b8"><tspan x="523" dy="0">74 historically funded · 0 in Wave 1</tspan></text><rect x="70" y="565" width="400" height="110" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/><text x="98" y="613.53" font-size="20" font-weight="700" fill="#f1f5f9"><tspan x="98" dy="0">12-word seeds</tspan></text><text x="98" y="642.46" font-size="15" fill="#94a3b8"><tspan x="98" dy="0">Mk3 5.0.3 · 0 funded</tspan></text><rect x="495" y="565" width="400" height="110" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/><text x="523" y="613.53" font-size="20" font-weight="700" fill="#f1f5f9"><tspan x="523" dy="0">Paper wallets</tspan></text><text x="523" y="642.46" fon