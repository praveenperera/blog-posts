<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc"><title id="title">The missing 153 as an attribution clue</title><desc id="desc">The missing transactions share the confirmed Wave 1 builder but their upstream seed candidates remain outside reproduced public models.</desc><rect width="1500" height="720" fill="#0f172a"/><style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.h{font-size:38px;font-weight:700;fill:#f1f5f9}.s{font-size:18px;fill:#94a3b8}.t{font-size:22px;font-weight:700;fill:#f1f5f9}.c{font-size:20px;font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,monospace;fill:#f1f5f9}.ok{fill:#6ee7b7}.bad{fill:#fca5a5}</style><defs><marker id="arr-c7d2fe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0L10 5L0 10z" fill="#c7d2fe"/></marker></defs><text x="60" y="70.52" font-size="38" font-weight="700" fill="#f1f5f9"><tspan x="60" dy="0">The 153 share the output tool, but not a reproduced input model</tspan></text><text x="60" y="106.25" font-size="18" fill="#94a3b8"><tspan x="60" dy="0">That split can reveal attacker capability before it can reveal identity</tspan></text><rect x="70" y="165" width="390" height="150" rx="22" fill="#052e2b" stroke="#34d399" stroke-width="2"/><text x="105" y="209.41" font-size="15" font-weight="700" fill="#6ee7b7"><tspan x="105" dy="0">CONFIRMED DOWNSTREAM</tspan></text><text x="105" y="248.99" font-size="21" font-weight="700" fill="#f1f5f9"><tspan x="105" dy="0">Same Wave 1 builder</tspan></text><text x="105" y="281.22" font-size="16" fill="#94a3b8"><tspan x="105" dy="0">fee · input order · sequence · grouping</tspan></text><path d="M465 240L628 240" fill="none" stroke="#c7d2fe" stroke-width="5" stroke-linecap="round" marker-end="url(#arr-c7d2fe)"/><rect x="640" y="165" width="330" height="150" rx="22" fill="#3b2410" stroke="#fdba74" stroke-width="2"/><text x="675" y="209.41" font-size="15" font-weight="700" fill="#fdba74"><tspan x="675" dy="0">UNRESOLVED BOUNDARY</tspan></text><text x="675" y="248.99" font-size="21" font-weight="700" fill="#f1f5f9"><tspan x="675" dy="0">153 source addresses</tspan></text><text x="675" y="281.22" font-size="16" fill="#94a3b8"><tspan x="675" dy="0">132.94923662 BTC</tspan></text><path d="M975 240L1138 240" fill="none" stroke="#c7d2fe" stroke-width="5" stroke-linecap="round" marker-end="url(#arr-c7d2fe)"/><rect x="1150" y="165" width="280" height="150" rx="22" fill="#1e1b4b" stroke="#a5b4fc" stroke-width="2"/><text x="1185" y="209.41" font-size="15" font-weight="700" fill="#93c5fd"><tspan x="1185" dy="0">UNKNOWN UPSTREAM</tspan></text><text x="1185" y="248.99" font-size="21" font-weight="700" fill="#f1f5f9"><tspan x="1185" dy="0">Different input?</tspan></text><text x="1185" y="281.22" font-size="16" fill="#94a3b8"><tspan x="1185" dy="0">trace · path · data · family</tspan></text><text x="70" y="385.29" font-size="21" font-weight="700" fill="#f1f5f9"><tspan x="70" dy="0">Public reconstruction already finds:</tspan></text><rect x="70" y="415" width="321.25" height="105" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/><text x="105" y="459.74" font-size="21" font-weight="700" fill="#f1f5f9"><tspan x="105" dy="0">328 Wave 1 seeds</tspan></text><text x="105" y="491.97" font-size="16" fill="#94a3b8"><tspan x="105" dy="0">known set reproduces</tspan></text><rect x="416.25" y="415" width="321.25" height="105" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/><text x="451.25" y="459.74" font-size="21" font-weight="700" fill="#f1f5f9"><tspan x="451.25" dy="0">685 outside seeds</tspan></text><text x="451.25" y="491.97" font-size="16" fill="#94a3b8"><tspan x="451.25" dy="0">model still finds wallets</tspan></text><rect x="762.5" y="415" width="321.25" height="105" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/><text x="797.5" y="459.74" font-size="21" font-weight="700" fill="#f1f5f9"><tspan x="797.5" dy="0">Alternative traces</tspan></text><text x="797.5" y="491.97" font-size="16" fill="#94a3b8"><tspan x="797.5" dy="0">outside finds, no new 153</tspan></text><rect x="1108.75" y="415" width="321.25" height="105" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/><text x="1143.75" y="459.74" font-size="21" font-weight="700" fill="#f1f5f9"><tspan x="1143.75" dy="0">Higher pad ranges</tspan></text><text x="1143.75" y="491.97" font-size="16" fill="#94a3b8"><tspan x="1143.75" dy="0">zero in exact tested scopes</tspan></text><rect x="70" y="565" width="1360" height="100" rx="20" fill="#1e293b" stroke="#334155" stroke-width="2"/><text x="105" y="602.21" font-size="15" font-weight="700" fill="#93c5fd"><tspan x="105" dy="0">ATTRIBUTION VALUE</tspan></text><text x="105" y="641.79" font-size="21" font-weight="700" fill="#f1f5f9"><tspan x="105" dy="0">Tool lineage → access class → related campaign</tspan></text><text x="865" y="641.79" font-size="18" fill="#94a3b8"><tspan x="865" dy="0">does not identify a person without separate evidence</tspan></text></svg>