<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc"><title id="title">Wave 2 did not use the Wave 1 builder</title><desc id="desc">Same weak-key space. Different transaction construction.</desc><rect width="1500" height="720" fill="#0f172a"/><style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.h{font-size:38px;font-weight:700;fill:#f1f5f9}.s{font-size:18px;fill:#94a3b8}.t{font-size:22px;font-weight:700;fill:#f1f5f9}.c{font-size:20px;font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,monospace;fill:#f1f5f9}.ok{fill:#6ee7b7}.bad{fill:#fca5a5}</style><rect x="0" y="0" width="1500" height="720" fill="#0f172a"/><text x="40" y="66.47" font-size="34" font-weight="700" fill="#f1f5f9"><tspan x="40" dy="0">Wave 2 did not use the Wave 1 builder</tspan></text><text x="40" y="102.45" font-size="18" fill="#94a3b8"><tspan x="40" dy="0">Same weak-key space. Different transaction construction.</tspan></text><rect x="41" y="132.6" width="698" height="554.4" rx="15" fill="#172554" stroke="#60a5fa" stroke-width="2"/><text x="62" y="173.93" font-size="24" font-weight="700" fill="#f1f5f9"><tspan x="62" dy="0">Wave 1</tspan></text><text x="62" y="213.02" font-size="16" fill="#94a3b8"><tspan x="62" dy="0">nSequence</tspan></text><text x="274" y="215.05" font-size="18" font-weight="700" fill="#f1f5f9"><tspan x="274" dy="0">0xffffffff</tspan></text><text x="62" y="252.42" font-size="16" fill="#94a3b8"><tspan x="62" dy="0">RBF</tspan></text><text x="274" y="254.45" font-size="18" font-weight="700" fill="#f1f5f9"><tspan x="274" dy="0">no</tspan></text><text x="62" y="291.82" font-size="16" fill="#94a3b8"><tspan x="62" dy="0">Fee rule</tspan></text><text x="274" y="293.85" font-size="18" font-weight="700" fill="#f1f5f9"><tspan x="274" dy="0">30 × static size</tspan></text><text x="62" y="331.22" font-size="16" fill="#94a3b8"><tspan x="62" dy="0">Input order</tspan></text><text x="274" y="333.25" font-size="18" font-weight="700" fill="#f1f5f9"><tspan x="274" dy="0">newest-first 145 / 145</tspan></text><text x="62" y="370.62" font-size="16" fill="#94a3b8"><tspan x="62" dy="0">Grouping</tspan></text><text x="274" y="372.65" font-size="18" font-weight="700" fill="#f1f5f9"><tspan x="274" dy="0">one source address per tx</tspan></text><text x="62" y="410.02" font-size="16" fill="#94a3b8"><tspan x="62" dy="0">Version / locktime</tspan></text><text x="274" y="412.05" font-size="18" font-weight="700" fill="#f1f5f9"><tspan x="274" dy="0">2 / 0</tspan></text><text x="62" y="449.42" font-size="16" fill="#94a3b8"><tspan x="62" dy="0">Low-R grinding</tspan></text><text x="274" y="451.45" font-size="18" font-weight="700" fill="#f1f5f9"><tspan x="274" dy="0">no</tspan></text><text x="62" y="496.82" font-size="16" fill="#94a3b8"><tspan x="62" dy="0">Same builder on all three destination branches</tspan></text><rect x="761" y="132.6" width="698" height="554.4" rx="15" fill="#3b2410" stroke="#fdba74" stroke-width="2"/><text x="782" y="173.93" font-size="24" font-weight="700" fill="#f1f5f9"><tspan x="782" dy="0">Wave 2</tspan></text><text x="782" y="213.02" font-size="16" fill="#94a3b8"><tspan x="782" dy="0">nSequence</tspan></text><text x="994" y="215.05" font-size="18" font-weight="700" fill="#f1f5f9"><tspan x="994" dy="0">0xfffffffd</tspan></text><text x="782" y="252.42" font-size="16" fill="#94a3b8"><tspan x="782" dy="0">RBF</tspan></text><text x="994" y="254.45" font-size="18" font-weight="700" fill="#f1f5f9"><tspan x="994" dy="0">yes</tspan></text><text x="782" y="291.82" font-size="16" fill="#94a3b8"><tspan x="782" dy="0">Fee rule</tspan></text><text x="994" y="293.85" font-size="18" font-weight="700" fill="#f1f5f9"><tspan x="994" dy="0">about 10 or 50 sat/vB</tspan></text><text x="782" y="331.22" font-size="16" fill="#94a3b8"><tspan x="782" dy="0">Input order</tspan></text><text x="994" y="333.25" font-size="18" font-weight="700" fill="#f1f5f9"><tspan x="994" dy="0">newest-first 2 / 11</tspan></text><text x="782" y="370.62" font-size="16" fill="#94a3b8"><tspan x="782" dy="0">Grouping</tspan></text><text x="994" y="372.65" font-size="18" font-weight="700" fill="#f1f5f9"><tspan x="994" dy="0">batches or 1-input splits</tspan></text><text x="782" y="410.02" font-size="16" fill="#94a3b8"><tspan x="782" dy="0">Version / locktime</tspan></text><text x="994" y="412.05" font-size="18" font-weight="700" fill="#f1f5f9"><tspan x="994" dy="0">2 / 0</tspan></text><text x="782" y="449.42" font-size="16" fill="#94a3b8"><tspan x="782" dy="0">Low-R grinding</tspan></text><text x="994" y="451.45" font-size="18" font-weight="700" fill="#f1f5f9"><tspan x="994" dy="0">no</tspan></text><text x="782" y="496.82" font-size="16" fill="#94a3b8"><tspan x="782" dy="0">A second tool or a second operator is plausible</tspan></text></svg>